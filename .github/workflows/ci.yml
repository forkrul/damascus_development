name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: shellcheck + repo integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: bash syntax check
        run: bash -n install.sh tests/smoke.sh

      - name: shellcheck
        run: shellcheck install.sh tests/smoke.sh

      - name: alias symlinks are relative and resolve to stage skills
        run: |
          for l in skills/*; do
            [ -L "$l" ] || continue
            target="$(readlink "$l")"
            case "$target" in
              /*) echo "::error::$l is an absolute symlink"; exit 1 ;;
            esac
            [ -f "$l/SKILL.md" ] || { echo "::error::$l does not resolve to a skill"; exit 1; }
          done

      # The name lists come from install.sh itself (sourced, not executed), so a rename
      # on disk or in the script cannot pass CI unless both sides agree.
      - name: every skill, alias, agent and KEEP skill named in install.sh exists on disk
        run: |
          # shellcheck disable=SC1091
          source ./install.sh
          for s in "${STAGE_SKILLS[@]}"; do
            [ -f "skills/$s/SKILL.md" ] || { echo "::error::skills/$s/SKILL.md missing"; exit 1; }
          done
          for pair in "${ALIASES[@]}"; do
            alias="${pair%%:*}" stage="${pair#*:}"
            [ -L "skills/$alias" ] || { echo "::error::skills/$alias is not a symlink"; exit 1; }
            [ "$(readlink "skills/$alias")" = "$stage" ] || { echo "::error::skills/$alias should point at $stage"; exit 1; }
          done
          for a in "${AGENTS[@]}"; do
            [ -f "agents/$a.md" ] || { echo "::error::agents/$a.md missing"; exit 1; }
          done
          for s in "${SUPERPOWERS_KEEP[@]}"; do
            [ -f "vendor/superpowers/skills/$s/SKILL.md" ] || { echo "::error::KEEP skill $s missing upstream — update SUPERPOWERS_KEEP"; exit 1; }
          done
          # every stage dir on disk is either a stage or an alias (no orphan skills)
          for d in skills/*; do
            name="$(basename "$d")"
            printf '%s\n' "${STAGE_SKILLS[@]}" "${ALIASES[@]%%:*}" | grep -Fxq "$name" \
              || { echo "::error::$d is not listed in install.sh"; exit 1; }
          done
          # every upstream skill has a policy: KEEP (linked) or DENY (named in README)
          for d in vendor/superpowers/skills/*; do
            name="$(basename "$d")"
            printf '%s\n' "${SUPERPOWERS_KEEP[@]}" | grep -Fxq "$name" && continue
            grep -Eq "^\| \`$name\` \| DENY \|" README.md \
              || { echo "::error::upstream skill '$name' is neither KEEP in install.sh nor DENY in README.md — classify it"; exit 1; }
          done

      - name: frontmatter lint (name + description)
        run: |
          for f in skills/*/SKILL.md agents/*.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "::error::$f has no YAML frontmatter"; exit 1; }
            awk '/^---$/{c++; next} c==1 && /^name:/{n=1} c==1 && /^description:/{d=1} END{exit !(n && d)}' "$f" \
              || { echo "::error::$f frontmatter is missing name or description"; exit 1; }
          done

      # Policy (CLAUDE.md): vendor pointers sit on upstream tags, and the README names
      # the tag. Dependabot bumps to head commits fail here by design — re-pin to a tag.
      - name: vendor submodules are pinned to upstream tags named in the README
        run: |
          for sub in vendor/superpowers vendor/spec-kit; do
            git -C "$sub" fetch --quiet --tags origin
            tag="$(git -C "$sub" describe --tags --exact-match HEAD 2>/dev/null)" \
              || { echo "::error::$sub is at $(git -C "$sub" rev-parse --short HEAD), which is not an upstream tag"; exit 1; }
            grep -Fq "| $tag |" README.md \
              || { echo "::error::README.md vendored-submodules table does not list $sub at $tag"; exit 1; }
            echo "$sub @ $tag"
          done

      - name: example artifact trail covers every smithy state
        run: |
          ex=examples/cart-discounts
          for f in .prd/001_cart-discount-codes.md \
                   specs/001-cart-discount-codes/spec.md specs/001-cart-discount-codes/plan.md \
                   specs/001-cart-discount-codes/tasks.md specs/001-cart-discount-codes/review.md \
                   specs/001-cart-discount-codes/quench-log.md specs/001-cart-discount-codes/code-review.md \
                   specs/001-cart-discount-codes/smithy-log.md; do
            [ -f "$ex/$f" ] || { echo "::error::$ex/$f missing"; exit 1; }
          done
          spec="$ex/specs/001-cart-discount-codes"
          grep -q 'A++' "$spec/review.md"      || { echo "::error::review.md never reaches A++"; exit 1; }
          grep -q 'A++' "$spec/code-review.md" || { echo "::error::code-review.md never reaches A++"; exit 1; }
          grep -q '^FINISH:\|FINISH:' "$spec/smithy-log.md" || { echo "::error::smithy-log.md has no FINISH entry"; exit 1; }
          grep -q '^- \[ \]' "$spec/tasks.md" && { echo "::error::tasks.md has unchecked tasks at pipeline end"; exit 1; }
          echo "example trail complete"

  smoke:
    name: install/uninstall smoke test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: smoke test (default bash)
        run: tests/smoke.sh

      - name: smoke test (stock macOS bash 3.2)
        if: runner.os == 'macOS'
        run: SMOKE_BASH=/bin/bash tests/smoke.sh

  changelog:
    name: changelog updated
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: PR touches CHANGELOG.md
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated"
          else
            echo "::error::every PR must update CHANGELOG.md under [Unreleased] (see CLAUDE.md)"
            exit 1
          fi
