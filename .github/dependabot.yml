version: 2
updates:
  # vendor/superpowers and vendor/spec-kit. Dependabot targets head commits, and CI
  # requires each pointer to sit on an upstream tag named in the README, so these PRs
  # fail by design — treat them as "a new upstream release may exist", close them, and
  # bump to the tag by hand (policy in CLAUDE.md). The smoke test and the KEEP/DENY
  # classification check then validate the deliberate bump.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
